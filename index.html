<meta name="theme-color" content="#C0390B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root {
    --red: #C0390B;
    --orange: #E85A10;
    --orange2: #FF8C00;
    --yellow: #F5C200;
    --cream: #F5EE8A;
    --white: #FFFFFF;
    --dark: #2C1A0E;
    --gray: #f4f4f4;
    --card-shadow: 0 4px 20px rgba(192,57,11,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--gray);
    color: var(--dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  .app-header {
    background: linear-gradient(135deg, var(--red) 0%, var(--orange) 100%);
    padding: 16px 20px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .header-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    color: var(--white);
    letter-spacing: 1px;
    line-height: 1;
  }

  .header-subtitle {
    font-size: 11px;
    color: rgba(255,255,255,0.8);
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .heart-icon {
    font-size: 32px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  /* ── SEARCH ── */
  .search-wrap {
    position: relative;
  }

  .search-input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    border-radius: 25px;
    border: none;
    background: rgba(255,255,255,0.2);
    color: var(--white);
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 600;
    outline: none;
    transition: background 0.2s;
  }

  .search-input::placeholder { color: rgba(255,255,255,0.7); }
  .search-input:focus { background: rgba(255,255,255,0.3); }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    pointer-events: none;
  }

  /* ── NAV TABS ── */
  .nav-tabs {
    display: flex;
    background: var(--white);
    border-bottom: 2px solid var(--cream);
    overflow-x: auto;
    scrollbar-width: none;
    position: sticky;
    top: 118px;
    z-index: 99;
  }
  .nav-tabs::-webkit-scrollbar { display: none; }

  .nav-tab {
    flex-shrink: 0;
    padding: 12px 16px;
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    font-weight: 800;
    color: #999;
    border: none;
    background: none;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .nav-tab.active {
    color: var(--orange);
    border-bottom-color: var(--orange);
  }

  .nav-tab.has-today {
    color: var(--red);
  }

  /* ── TODAY BANNER ── */
  .today-banner {
    background: linear-gradient(135deg, var(--yellow), var(--orange2));
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideIn 0.4s ease;
  }

  .today-banner-text {
    font-size: 13px;
    font-weight: 800;
    color: var(--dark);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── MAIN CONTENT ── */
  .main-content {
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
  }

  /* ── VIEW TOGGLE ── */
  .view-toggle {
    display: flex;
    background: var(--white);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 16px;
    box-shadow: var(--card-shadow);
  }

  .toggle-btn {
    flex: 1;
    padding: 8px;
    border-radius: 9px;
    border: none;
    background: none;
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    font-weight: 800;
    color: #aaa;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }

  .toggle-btn.active {
    background: var(--orange);
    color: var(--white);
    box-shadow: 0 2px 8px rgba(232,90,16,0.4);
  }

  /* ── DAY GROUP ── */
  .day-group {
    margin-bottom: 20px;
    animation: fadeUp 0.3s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .day-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .day-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    color: var(--orange);
    line-height: 1;
    min-width: 56px;
    text-align: center;
  }

  .day-number.today {
    color: var(--red);
    text-shadow: 0 2px 8px rgba(192,57,11,0.3);
  }

  .day-line {
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, var(--yellow), transparent);
    border-radius: 2px;
  }

  .today-badge {
    background: var(--red);
    color: white;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    animation: pulse 1.5s infinite;
  }

  /* ── STUDENT CARD ── */
  .student-card {
    background: var(--white);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 8px;
    box-shadow: var(--card-shadow);
    display: flex;
    align-items: center;
    gap: 14px;
    border-left: 4px solid var(--orange);
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
    overflow: hidden;
  }

  .student-card:active {
    transform: scale(0.98);
    box-shadow: 0 2px 8px rgba(192,57,11,0.1);
  }

  .student-card.today-card {
    border-left-color: var(--red);
    background: linear-gradient(135deg, #fff9f7, #fff);
  }

  .student-card::after {
    content: '🎂';
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    opacity: 0.15;
  }

  .student-card.today-card::after {
    opacity: 0.4;
    animation: spin 3s linear infinite;
  }

  @keyframes spin {
    from { transform: translateY(-50%) rotate(0deg); }
    to { transform: translateY(-50%) rotate(360deg); }
  }

  .card-cake {
    font-size: 28px;
    flex-shrink: 0;
  }

  .card-info { flex: 1; min-width: 0; }

  .card-name {
    font-size: 14px;
    font-weight: 800;
    color: var(--dark);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }

  .card-date {
    font-size: 11px;
    font-weight: 600;
    color: #999;
    margin-bottom: 3px;
  }

  .card-group {
    font-size: 11px;
    font-weight: 700;
    color: var(--orange);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-age {
    background: var(--orange);
    color: var(--white);
    font-size: 13px;
    font-weight: 800;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .card-age.today-age {
    background: var(--red);
    animation: pulse 1.5s infinite;
  }

  /* ── CALENDAR VIEW ── */
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 16px;
  }

  .cal-day-label {
    text-align: center;
    font-size: 10px;
    font-weight: 800;
    color: #bbb;
    padding: 4px 0;
    text-transform: uppercase;
  }

  .cal-day {
    aspect-ratio: 1;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: #ccc;
    background: var(--white);
    position: relative;
    cursor: pointer;
    transition: transform 0.15s;
  }

  .cal-day:active { transform: scale(0.9); }

  .cal-day.empty { background: transparent; }

  .cal-day.has-birthday {
    background: linear-gradient(135deg, var(--yellow), var(--orange2));
    color: var(--dark);
    box-shadow: 0 2px 8px rgba(245,194,0,0.4);
  }

  .cal-day.is-today {
    background: linear-gradient(135deg, var(--red), var(--orange));
    color: var(--white);
    box-shadow: 0 2px 12px rgba(192,57,11,0.5);
    font-size: 14px;
  }

  .cal-day .dot {
    position: absolute;
    bottom: 3px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--red);
  }

  .cal-day.has-birthday .dot { background: var(--red); }
  .cal-day.is-today .dot { background: var(--white); }

  /* ── SEARCH RESULTS ── */
  .search-results-header {
    font-size: 13px;
    font-weight: 800;
    color: #999;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #bbb;
  }
  .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; font-weight: 600; }

  /* ── MONTH SUMMARY ── */
  .month-summary {
    background: linear-gradient(135deg, var(--orange), var(--red));
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 16px rgba(192,57,11,0.3);
  }

  .month-summary-count {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    line-height: 1;
  }

  .month-summary-label {
    font-size: 11px;
    font-weight: 700;
    opacity: 0.85;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .month-summary-icon { font-size: 40px; }

  /* ── INSTALL PROMPT ── */
  .install-prompt {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--dark);
    color: var(--white);
    padding: 12px 20px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    cursor: pointer;
    z-index: 1000;
    white-space: nowrap;
    animation: slideUp 0.4s ease;
  }

  @keyframes slideUp {
    from { transform: translateX(-50%) translateY(20px); opacity: 0; }
    to { transform: translateX(-50%) translateY(0); opacity: 1; }
  }

  .install-close {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── CONFETTI ── */
  .confetti-container {
    position: fixed;
    top: 0; left: 0; right: 0;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
    height: 100vh;
  }

  .confetti-piece {
    position: absolute;
    width: 8px;
    height: 8px;
    animation: confettiFall linear both;
    top: -20px;
  }

  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>

// ── STATE ──
const today = new Date();
const todayD = today.getDate();
const todayM = today.getMonth() + 1;
let currentMonth = todayM;
let currentView = 'list'; // 'list' | 'calendar'
let searchQuery = '';

// ── HELPERS ──
function age(y) { return 2026 - y; }

function isToday(d, m) { return d === todayD && m === todayM; }

function getDaysInMonth(m) {
  return new Date(2026, m, 0).getDate();
}

function getFirstDayOfMonth(m) {
  return new Date(2026, m - 1, 1).getDay();
}

// ── RENDER NAV ──
function renderNav() {
  const tabs = document.getElementById('navTabs');
  tabs.innerHTML = '';
  for (let m = 1; m <= 12; m++) {
    const count = STUDENTS.filter(s => s.m === m).length;
    const hasTodayBday = STUDENTS.some(s => s.m === m && s.d === todayD && m === todayM);
    const btn = document.createElement('button');
    btn.className = `nav-tab${m === currentMonth ? ' active' : ''}${hasTodayBday ? ' has-today' : ''}`;
    btn.innerHTML = `${hasTodayBday ? '🎂 ' : ''}${MONTHS[m].slice(0,3).toUpperCase()}<br><span style="font-size:10px;opacity:0.7">${count}</span>`;
    btn.onclick = () => { currentMonth = m; renderAll(); scrollToActiveTab(); };
    tabs.appendChild(btn);
  }
}

function scrollToActiveTab() {
  const tabs = document.getElementById('navTabs');
  const active = tabs.querySelector('.active');
  if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

// ── TODAY BANNER ──
function renderTodayBanner() {
  const todayStudents = STUDENTS.filter(s => isToday(s.d, s.m));
  const banner = document.getElementById('todayBanner');
  const text = document.getElementById('todayBannerText');
  if (todayStudents.length > 0) {
    banner.style.display = 'flex';
    const names = todayStudents.map(s => s.name.split(',')[0]).join(', ');
    text.textContent = `¡Hoy cumplen años: ${names}!`;
    triggerConfetti();
  } else {
    banner.style.display = 'none';
  }
}

// ── CONFETTI ──
function triggerConfetti() {
  const container = document.getElementById('confettiContainer');
  const colors = ['#C0390B','#E85A10','#F5C200','#FF8C00','#FF6B35'];
  for (let i = 0; i < 40; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.animationDuration = (2 + Math.random() * 3) + 's';
    piece.style.animationDelay = (Math.random() * 2) + 's';
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 5000);
  }
}

// ── RENDER STUDENT CARD ──
function renderCard(s, showDay = false) {
  const isTod = isToday(s.d, s.m);
  const a = age(s.y);
  return `
    <div class="student-card${isTod ? ' today-card' : ''}">
      <span class="card-cake">🎂</span>
      <div class="card-info">
        <div class="card-name">${s.name}</div>
        <div class="card-date">${String(s.d).padStart(2,'0')}/${String(s.m).padStart(2,'0')}/${s.y}</div>
        <div class="card-group">${s.g}</div>
      </div>
      <div class="card-age${isTod ? ' today-age' : ''}">${a}</div>
    </div>`;
}

// ── RENDER LIST VIEW ──
function renderListView(students) {
  // Group by day
  const byDay = {};
  students.forEach(s => {
    if (!byDay[s.d]) byDay[s.d] = [];
    byDay[s.d].push(s);
  });

  const days = Object.keys(byDay).map(Number).sort((a,b) => a-b);
  let html = '';

  days.forEach((day, i) => {
    const isTod = day === todayD && currentMonth === todayM;
    html += `<div class="day-group" style="animation-delay:${i*0.05}s">
      <div class="day-header">
        <div class="day-number${isTod ? ' today' : ''}">${day}</div>
        <div class="day-line"></div>
        ${isTod ? '<span class="today-badge">Hoy 🎉</span>' : ''}
      </div>`;
    byDay[day].forEach(s => { html += renderCard(s); });
    html += `</div>`;
  });

  return html;
}

// ── RENDER CALENDAR VIEW ──
function renderCalendarView(students) {
  const birthdayDays = new Set(students.map(s => s.d));
  const daysInMonth = getDaysInMonth(currentMonth);
  const firstDay = getFirstDayOfMonth(currentMonth);

  let html = '<div class="calendar-grid">';
  ['D','L','M','X','J','V','S'].forEach(d => {
    html += `<div class="cal-day-label">${d}</div>`;
  });

  // Empty cells
  for (let i = 0; i < firstDay; i++) {
    html += `<div class="cal-day empty"></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const hasBday = birthdayDays.has(d);
    const isTod = d === todayD && currentMonth === todayM;
    const count = students.filter(s => s.d === d).length;
    html += `<div class="cal-day${hasBday ? ' has-birthday' : ''}${isTod ? ' is-today' : ''}"
      onclick="jumpToDay(${d})"
    >${d}${count > 1 ? `<span class="dot"></span>` : (hasBday ? `<span class="dot"></span>` : '')}
    </div>`;
  }

  html += '</div>';

  // List below calendar
  html += renderListView(students);
  return html;
}

// ── JUMP TO DAY ──
function jumpToDay(day) {
  currentView = 'list';
  renderMain();
  setTimeout(() => {
    const groups = document.querySelectorAll('.day-group');
    groups.forEach(g => {
      if (g.querySelector('.day-number') &&
          g.querySelector('.day-number').textContent == day) {
        g.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  }, 100);
}
window.jumpToDay = jumpToDay;

// ── RENDER MAIN ──
function renderMain() {
  const content = document.getElementById('mainContent');
  let students;

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    students = STUDENTS.filter(s =>
      s.name.toLowerCase().includes(q) ||
      s.g.toLowerCase().includes(q)
    );

    const toggleHtml = `<div class="search-results-header">
      ${students.length} resultado${students.length !== 1 ? 's' : ''} para "${searchQuery}"
    </div>`;

    if (students.length === 0) {
      content.innerHTML = toggleHtml + `<div class="empty-state">
        <div class="emoji">🔍</div>
        <p>No se encontraron alumnos</p>
      </div>`;
    } else {
      const byMonth = {};
      students.forEach(s => {
        if (!byMonth[s.m]) byMonth[s.m] = [];
        byMonth[s.m].push(s);
      });
      let html = toggleHtml;
      Object.keys(byMonth).sort((a,b) => a-b).forEach(m => {
        html += `<div style="font-size:13px;font-weight:800;color:var(--orange);
          text-transform:uppercase;letter-spacing:0.5px;margin:16px 0 8px">
          ${MONTHS[m]}
        </div>`;
        html += renderListView(byMonth[m]);
      });
      content.innerHTML = html;
    }
    return;
  }

  students = STUDENTS.filter(s => s.m === currentMonth)
    .sort((a,b) => a.d - b.d || a.name.localeCompare(b.name));

  const toggleHtml = `
    <div class="month-summary">
      <div>
        <div class="month-summary-count">${students.length}</div>
        <div class="month-summary-label">cumpleaños en ${MONTHS[currentMonth]}</div>
      </div>
      <div class="month-summary-icon">🎂</div>
    </div>
    <div class="view-toggle">
      <button class="toggle-btn${currentView==='list'?' active':''}" onclick="setView('list')">
        ☰ Lista
      </button>
      <button class="toggle-btn${currentView==='calendar'?' active':''}" onclick="setView('calendar')">
        📅 Calendario
      </button>
    </div>`;

  if (students.length === 0) {
    content.innerHTML = toggleHtml + `<div class="empty-state">
      <div class="emoji">🎈</div>
      <p>Sin cumpleaños este mes</p>
    </div>`;
    return;
  }

  const bodyHtml = currentView === 'calendar'
    ? renderCalendarView(students)
    : renderListView(students);

  content.innerHTML = toggleHtml + bodyHtml;
}

function setView(v) {
  currentView = v;
  renderMain();
}
window.setView = setView;

function renderAll() {
  renderNav();
  renderTodayBanner();
  renderMain();
}

// ── SEARCH ──
document.getElementById('searchInput').addEventListener('input', function() {
  searchQuery = this.value.trim();
  renderAll();
});

// ── PWA INSTALL ──
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const prompt = document.getElementById('installPrompt');
  prompt.style.display = 'flex';
  prompt.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt = null;
      prompt.style.display = 'none';
    }
  });
});

// ── INIT ──
renderAll();
scrollToActiveTab();
</script>
</body>
</html>
